# Offline test suite: no GPU, no model weights, no credentials, no network tests.
# tests/run-offline.sh only lints tests/test-download.sh and tests/gpu-smoke.sh; it never runs them
# (test-download.sh also skips itself when CI=true).
name: offline-tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Tool versions
        run: |
          bash --version | head -1; python3 --version; curl --version | head -1
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          shellcheck --version | sed -n 2p
      - name: Offline suite
        run: tests/run-offline.sh
