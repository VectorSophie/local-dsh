# Generated by local-dsh install.sh (dsh-tui profile: third-party terminal UI plugin).
# Pin the TUI to the local route; the bundle default is deepseek-official / max. A patch replaces the whole
# config, so the bundle's other keys are restated unchanged.
- id: dsh-tui
  config:
    provider: local-dsh
    model: @ALIAS@
    effort: high
    fullscreen: true
    terminalImages: true
    preset: !!js process.env.DSH_TUI_PRESET ?? undefined
    workspace: !!js process.env.DSH_TUI_WORKSPACE_TARGET ?? undefined
    sessionId: !!js process.env.DSH_TUI_RESUME_SESSION ?? undefined
    backend: !!js process.env.DSH_TUI_BACKEND || undefined

# No DeepSeek account sign-in and no session-log upload to a DeepSeek baseURL.
- id: deepseek-account
  disabled: true
- id: session-log-deepseek
  disabled: true

# The shipped 'standard' agent preset declared without its tool-web row (appended by install.sh). Without a
# profile declaration the TUI registers the stock preset, and every session fails:
# "failed to create agent ... tool-web".
