# Generated by local-dsh install.sh from templates/home.patch.yml; re-running install.sh rewrites it
# (the previous copy is kept as *.bak-<timestamp>). Applies to every profile under this DSH_HOME.
# Routes dsh to the local llama-server and disables every row that would call a paid API or send telemetry.

# Local OpenAI-compatible route. llama-server needs no key, but the pi-ai OpenAI adapter requires one,
# so LOCAL_DSH_KEY holds a fixed non-secret placeholder (exported by the launcher).
- id: llm-pi-ai
  config:
    providers:
      local-dsh:
        displayName: Local model (llama.cpp, local-dsh)
        api: openai-completions
        baseURL: http://127.0.0.1:@PORT@/v1
        apiKeyEnv: LOCAL_DSH_KEY
        compat:
          # llama-server honors the OpenAI-style reasoning_effort field ("none" = thinking off)
          thinkingFormat: openai
          supportsReasoningEffort: true
          supportsDeveloperRole: false
          supportsStore: false
          maxTokensField: max_tokens
          supportsUsageInStreaming: true
        retryPolicy:
          mode: normal
          maxRetries: 2
        models:
          - id: @ALIAS@
            name: @MODEL_NAME@
            contextWindow: @CTX@     # must equal llama-server --ctx-size (CTX in config.env)
            maxTokens: 8192          # reasoning + answer share this budget
            input: [text]
            reasoningEfforts:
              'off': none            # template: thinking disabled
              low: low               # template: 50
              high: high             # template: 75 (DeepSeek default)
              xhigh: max             # template: 100

- id: agent-default-model
  config:
    provider: local-dsh
    model: @ALIAS@
    reasoningEffort: high      # without it dsh sends reasoning_effort "none" (thinking off)

# No hosted DeepSeek models or DeepSeek-API web search/fetch.
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: web
  disabled: true
- id: tool-web
  disabled: true

# No telemetry (the launcher also exports DSH_TELEMETRY_DISABLED=1).
- id: session-telemetry-otel
  disabled: true
